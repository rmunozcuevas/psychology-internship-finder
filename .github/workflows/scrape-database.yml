name: Refresh psychology internship database
on:
  schedule:
    - cron: '17 10 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r backend/requirements.txt
      - run: python backend/scrape.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
